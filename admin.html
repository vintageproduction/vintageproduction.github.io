<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Админка — Vintage Beats</title><style>
:root{
  color-scheme:light;
  --bg:#f1e4c8;--paper:#f8eed7;--ink:#3b2416;--mute:#7a5d48;--acc:#d9531e;--acc2:#e8a33d;--line:#c9b08a;--vinyl:#1a120d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1e1510;--paper:#2a1d15;--ink:#f1e4c8;--mute:#b79d82;--line:#4a3628;--vinyl:#0b0706}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1e1510;--paper:#2a1d15;--ink:#f1e4c8;--mute:#b79d82;--line:#4a3628;--vinyl:#0b0706}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5;position:relative}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
a{color:inherit}
.mono{font-family:"Courier New",monospace}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:2px double var(--line)}
.logo{font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.logo i{color:var(--acc);font-style:normal}
.top a{font:13px "Courier New",monospace;text-transform:uppercase;text-decoration:none;margin-left:16px;letter-spacing:.08em}
.top a:hover{color:var(--acc)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:44px 0 30px}
.hero small{font:13px "Courier New",monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.hero h1{font-size:clamp(38px,7vw,70px);line-height:1;margin:10px 0 14px;font-weight:700}
.hero h1 em{color:var(--acc)}
.hero p{color:var(--mute);font-size:18px;margin:0 0 22px;max-width:460px}
.btn{display:inline-block;background:var(--acc);color:#fff7e6;border:0;border-radius:999px;padding:12px 24px;font:700 14px "Courier New",monospace;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;margin:0 8px 8px 0}
.btn.o{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.vinyl{position:relative;width:100%;max-width:340px;aspect-ratio:1;border-radius:50%;margin:0 auto;background:
 radial-gradient(circle,transparent 0 31%,rgba(255,255,255,.06) 31.5% 32%,transparent 32.5% 38%,rgba(255,255,255,.05) 38.5% 39%,transparent 39.5% 46%,rgba(255,255,255,.05) 46.5% 47%,transparent 47.5%),
 conic-gradient(from 20deg,#1a120d,#2b1e16 10%,#1a120d 22%,#241a13 50%,#1a120d 62%,#2b1e16 80%,#1a120d);
 background-color:var(--vinyl);box-shadow:0 14px 30px rgba(40,20,5,.35);animation:spin 9s linear infinite;display:grid;place-items:center}
.vinyl::before{content:"VINTAGE BEATS";width:34%;aspect-ratio:1;border-radius:50%;background:var(--acc);display:grid;place-items:center;text-align:center;font:700 10px "Courier New",monospace;letter-spacing:.1em;color:#fff7e6;padding:14%;line-height:1.2}
.vinyl::after{content:"";position:absolute;width:5%;aspect-ratio:1;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.vinyl,.disc.on{animation:none}}
h2{font-size:clamp(26px,5vw,38px);margin:46px 0 6px}
.sub{color:var(--mute);font:13px "Courier New",monospace;text-transform:uppercase;letter-spacing:.12em;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:3px 3px 0 var(--line);text-align:center}
.disc{width:100%;max-width:150px;aspect-ratio:1;border-radius:50%;border:0;padding:0;margin:4px auto 12px;display:grid;place-items:center;cursor:pointer;color:#fff7e6;font-size:20px;background:
 radial-gradient(circle,var(--acc) 0 22%,transparent 23%),repeating-radial-gradient(circle,#1a120d 0 2px,#261a12 3px 4px);background-color:var(--vinyl)}
.disc:disabled{cursor:default;opacity:.85}
.disc.on{animation:spin 3s linear infinite}
.card b{display:block;font-size:19px}
.card .m{font:12px "Courier New",monospace;color:var(--mute);margin:2px 0 10px}
.card .pr{font:700 16px "Courier New",monospace;margin-bottom:10px}
.card .btn{padding:8px 18px;font-size:12px;margin:0}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.plan{border:2px dashed var(--line);border-radius:8px;padding:22px;background:var(--paper)}
.plan.hot{border:2px solid var(--acc)}
.plan h3{margin:0;font-size:20px}
.plan .p{font-size:42px;font-weight:700;color:var(--acc);margin:4px 0 8px}
.plan ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.cta{text-align:center;padding:30px 0 26px}
.cta p{color:var(--mute);font-size:17px}
footer{border-top:2px double var(--line);text-align:center;padding:18px 0 30px;font:12px "Courier New",monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
@media(max-width:700px){.hero{grid-template-columns:1fr;padding-top:28px}.vinyl{max-width:240px;order:-1}.logo{font-size:17px}.top a{margin-left:10px}}


.f input{display:block;width:100%;margin:0 0 8px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:16px Georgia,serif}
.f label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
.ar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ar button{border:0;background:transparent;color:var(--acc);font-size:18px;cursor:pointer;padding:4px 8px}
[hidden]{display:none!important}
.box{max-width:520px;margin:0 auto;padding:24px 18px 60px}
</style></head><body><div class="box">
<div class="logo" style="margin-bottom:18px">Vintage <i>Beats</i> · админка</div>
<div id="login" class="f"><input id="em" type="email" placeholder="Почта" autocomplete="username"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn" id="go">Войти</button><div id="lm" class="m"></div></div>
<div id="panel" hidden class="f">
<h2 id="ph" style="margin:0 0 10px;font-size:24px">Добавить бит</h2>
<input id="a-n" placeholder="Название"><input id="a-bpm" type="number" placeholder="BPM"><input id="a-key" placeholder="Тональность (F# min)"><input id="a-tag" placeholder="Жанр (trap / dark)"><input id="a-price" type="number" placeholder="Цена от, $">
<label>Демка (mp3, лучше 30–90 сек с тегом, до 45 МБ)<input id="a-file" type="file" accept="audio/*"></label>
<button class="btn" id="sv">Добавить</button><button class="btn o" id="cn" hidden>Отмена</button><div id="am" class="m"></div>
<h2 style="margin:26px 0 6px;font-size:24px">Мои биты</h2><div id="lst"></div>
<p><a href="/" style="color:var(--mute)">← на сайт</a> · <a href="#" id="out" style="color:var(--mute)">выйти</a></p>
</div></div><script>var SB="https://lyejwcetufbwjyeihjbg.supabase.co",KEY="sb_publishable_U6F7QYuQfUTkLhGN7tYweg_GXjfflzo";
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ss=null;try{ss=JSON.parse(localStorage.getItem("vb_sess"))}catch(e){}
function saveSess(j){ss={a:j.access_token,r:j.refresh_token,x:Math.floor(Date.now()/1000)+(j.expires_in||3600)};localStorage.setItem("vb_sess",JSON.stringify(ss))}
function token(){
  if(!ss)return Promise.reject(new Error("нужно войти"));
  if(ss.x>Date.now()/1000+60)return Promise.resolve(ss.a);
  return fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:ss.r})})
    .then(function(r){if(!r.ok)throw new Error("сессия истекла, войди снова");return r.json()}).then(function(j){saveSess(j);return ss.a});
}
function api(path,opt,auth){
  opt=opt||{};var h=Object.assign({apikey:KEY},opt.headers||{});
  return(auth?token():Promise.resolve(null)).then(function(t){if(t)h.Authorization="Bearer "+t;opt.headers=h;return fetch(SB+path,opt)})
  .then(function(r){if(!r.ok)return r.text().then(function(x){throw new Error(r.status+": "+x.slice(0,160))});return r.text().then(function(t){return t?JSON.parse(t):null})});
}
var rows=[],ed=null;
function msg(t){$("am").textContent=t}
function fill(b){
  $("a-n").value=b?b.name:"";$("a-bpm").value=b?b.bpm:"";$("a-key").value=b?b.musical_key:"";$("a-tag").value=b?b.tag:"";$("a-price").value=b?b.price:"";$("a-file").value="";
  $("sv").textContent=b?"Сохранить изменения":"Добавить";$("ph").textContent=b?"Изменить бит":"Добавить бит";$("cn").hidden=!b;
}
function load(){return api("/rest/v1/beats?select=*&order=created_at.desc").then(function(r){rows=r;
  $("lst").innerHTML=rows.map(function(b,i){return '<div class="ar"><span>'+esc(b.name)+(b.audio_path?' 🎧':'')+'</span><span><button data-e="'+i+'" title="Изменить">✎</button><button data-d="'+i+'" title="Удалить">✕</button></span></div>'}).join("")||'<p class="m">Битов пока нет</p>'})}
function show(){$("login").hidden=true;$("panel").hidden=false;load().catch(function(e){msg("Ошибка: "+e.message)})}
$("go").onclick=function(){
  $("lm").textContent="Вхожу…";
  fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.msg||j.error_description||"неверная почта или пароль");return j})})
  .then(function(j){saveSess(j);show()}).catch(function(e){$("lm").textContent="Ошибка: "+e.message});
};
$("out").onclick=function(e){e.preventDefault();localStorage.removeItem("vb_sess");location.reload()};
$("cn").onclick=function(){ed=null;fill(null);msg("")};
$("lst").onclick=function(e){
  var t=e.target,ie=t.getAttribute("data-e"),id=t.getAttribute("data-d");
  if(ie!==null){ed=rows[ie];fill(ed);msg("Правишь «"+ed.name+"». Новую демку выбирай, только если хочешь заменить.");window.scrollTo(0,0);return}
  if(id===null)return;
  var b=rows[id];if(!confirm("Удалить бит «"+b.name+"»?"))return;
  msg("Удаляю…");
  api("/rest/v1/beats?id=eq."+b.id,{method:"DELETE"},true)
  .then(function(){return b.audio_path?api("/storage/v1/object/demos/"+b.audio_path,{method:"DELETE"},true).catch(function(){}):0})
  .then(function(){msg("Удалено");return load()}).catch(function(e){msg("Ошибка: "+e.message)});
};
$("sv").onclick=function(){
  var n=$("a-n").value.trim(),f=$("a-file").files[0];
  if(!n){msg("Введи название");return}
  if(f&&f.size>45*1048576){msg("Файл больше 45 МБ, сделай демку короче");return}
  var row={name:n,bpm:$("a-bpm").value||"-",musical_key:$("a-key").value||"-",tag:$("a-tag").value||"beat",price:$("a-price").value||"20"};
  var old=ed&&ed.audio_path,JH={"Content-Type":"application/json"};
  msg(f?"Загружаю демку…":"Сохраняю…");
  var up=Promise.resolve();
  if(f){var p=Date.now()+"-"+f.name.toLowerCase().replace(/[^a-z0-9.]+/g,"-");
    up=api("/storage/v1/object/demos/"+p,{method:"POST",headers:{"Content-Type":f.type||"audio/mpeg"},body:f},true).then(function(){row.audio_path=p})}
  up.then(function(){return ed?api("/rest/v1/beats?id=eq."+ed.id,{method:"PATCH",headers:JH,body:JSON.stringify(row)},true):api("/rest/v1/beats",{method:"POST",headers:JH,body:JSON.stringify(row)},true)})
  .then(function(){if(f&&old)return api("/storage/v1/object/demos/"+old,{method:"DELETE"},true).catch(function(){})})
  .then(function(){ed=null;fill(null);msg("Готово ✓");return load()})
  .catch(function(e){msg("Ошибка: "+e.message)});
};
if(ss)show();
</script></body></html>
